# Reproducible representative frontier selected on 2026-07-17 from public,
# publisher-owned Hugging Face repositories. Equal-weight family coverage is a
# test denominator, not a claim about market share. The live report records the
# resolved commit for every repository.
version = 1
kv_dtypes = ["auto"]
gpu_counts = [1, 2, 4, 8]
utilization = 0.90
min_model_coverage = 0.80
min_hardware_coverage = 0.80
timeout = 45

# Add a local engine environment to turn static memory decisions into live
# installed-version preflights. Use probe = "load" only on a target GPU host.
# [[engines]]
# name = "vllm"
# python = "../.engine-envs/vllm/bin/python"
# probe = "config"
# required = false

[[models]]
id = "gpt-oss-20b-mxfp4"
family = "gpt-oss"
repo = "openai/gpt-oss-20b"
contexts = ["32k", "128k"]
expected_architecture = "gpt-oss-alternating-gqa"

