[project]
name = "kvfit"
version = "0.2.1"
description = "Will a Hugging Face LLM fit your GPU or DGX? Plan weights, KV cache or recurrent state, context, TP/DP, and measured calibration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Teïlo Millet" },
]
keywords = [
  "llm",
  "kv-cache",
  "gpu-memory",
  "vram-calculator",
  "capacity-planning",
  "model-serving",
  "long-context",
  "llm-memory-calculator",
  "gpu-memory-calculator",
  "model-fit",
  "inference-memory",
  "recurrent-state",
  "huggingface",
  "vllm",
  "sglang",
  "dgx",
  "dgx-spark",
  "gb10",
  "tensor-parallel",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/teilomillet/kvfit"
Documentation = "https://github.com/teilomillet/kvfit#readme"
Repository = "https://github.com/teilomillet/kvfit.git"
Issues = "https://github.com/teilomillet/kvfit/issues"

[project.scripts]
kvfit = "kvfit.cli:main"
kvfit-audit = "kvfit.audit:main"
kvfit-calibrate = "kvfit.calibrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×"]
