name: DGX Spark evidence

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Run all offline regressions and model evidence
        run: uv run pytest

  live-pinned-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Resolve pinned model and run independent oracle
        run: >-
          uv run kvfit-audit examples/dgx-spark-evidence.toml
          --output dgx-spark-evidence.json
      - name: Recheck pinned upstream storage shapes
        run: |
          uv run python evals/probe_sglang_dsa.py > sglang-dsa-storage.json
          diff -u tests/fixtures/sglang-dsa-storage.json sglang-dsa-storage.json
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: dgx-spark-evidence
          path: dgx-spark-evidence.json
          if-no-files-found: error
      - name: Recheck pinned DPA rank ownership
        run: uv run python evals/probe_sglang_dpa.py
      - name: Recheck pinned GLM checkpoint placement
        run: |
          uv run kvfit zai-org/GLM-5.3@aca966e4e02791568aa6a4ced368624b3d897f42 \
            --system dgx-b300 --nodes 4 --tp 8 --context 1m --kv-dtype fp8 \
            --parallelism sglang-dpa --cache-layout sglang-dsa-scaled --mtp \
            --concurrent-users 25 --active-sequences-per-user 2 \
            --runtime-reserve-gib 8 --utilization 0.8 --json > glm-dpa-live.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          observed = json.loads(Path('glm-dpa-live.json').read_text())
          expected = json.loads(Path('tests/fixtures/sglang-dpa.json').read_text())['weights']
          for key in ('routed_expert_bytes', 'replicated_bytes', 'expert_count'):
              assert observed['weight_placement'][key] == expected[key], key
          assert observed['concurrency']['recommended']['active_sequences'] == 64
          PY
